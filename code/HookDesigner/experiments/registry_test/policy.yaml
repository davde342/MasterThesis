# Native-layer variant of policy_win32.yaml: same target, same log sink, hooks on the ntdll
# registry syscall stubs instead of the advapi32 Reg* APIs.
#
# Key closes: NtClose is hooked for every handle type but logged only for registry key handles, tracked by the
# post-hook TrackOpenedKey on NtOpenKey / NtOpenKeyEx / NtCreateKey (see logic.cpp).
# Handles opened before attach are not tracked, so their closes are not logged.
#
# Key security queries: Also NtQuerySecurityObject is generic (files, processes, tokens, ...), so it is logged
# only for tracked registry key handles, checked by the pre-hook NoteSecurityQueryHandle.
configure:
  paradigm: inline_hook
  engines:
    - detours
  process: "registry_target.exe"
  logic_file: "logic.cpp"
  telemetry:
    logger: "spdlog"
    logger_config:
      type: "file"
      file: "registry_hook.log"
      level: "info"

hooks:
  # 1. KEY OPEN AND CREATE
  - module: ntdll.dll
    function_name: NtOpenKey
    address_resolution:
      strategy: export
    behaviors:
      log_rules:
        - name: "open"
          format: "EVENT|NtOpenKey|tid={__hook_tid}|root=0x{ObjectRoot(input_ObjectAttributes):x}|name={CopyObjectName(input_ObjectAttributes)}|access=0x{input_DesiredAccess:x}|out=0x{(uintptr_t)ReadPointer(output_KeyHandle):x}|status=0x{(ULONG)__hook_result:x}"
      security_policy:
        post_hook: TrackOpenedKey

  - module: ntdll.dll
    function_name: NtOpenKeyEx
    address_resolution:
      strategy: export
    behaviors:
      log_rules:
        - name: "open_ex"
          format: "EVENT|NtOpenKeyEx|tid={__hook_tid}|root=0x{ObjectRoot(input_ObjectAttributes):x}|name={CopyObjectName(input_ObjectAttributes)}|access=0x{input_DesiredAccess:x}|options=0x{input_OpenOptions:x}|out=0x{(uintptr_t)ReadPointer(output_KeyHandle):x}|status=0x{(ULONG)__hook_result:x}"
      security_policy:
        post_hook: TrackOpenedKey

  - module: ntdll.dll
    function_name: NtCreateKey
    address_resolution:
      strategy: export
    behaviors:
      log_rules:
        - name: "create"
          format: "EVENT|NtCreateKey|tid={__hook_tid}|root=0x{ObjectRoot(input_ObjectAttributes):x}|name={CopyObjectName(input_ObjectAttributes)}|access=0x{input_DesiredAccess:x}|options=0x{input_CreateOptions:x}|out=0x{(uintptr_t)ReadPointer(output_KeyHandle):x}|disposition={output_Disposition}|status=0x{(ULONG)__hook_result:x}"
      security_policy:
        post_hook: TrackOpenedKey


  # 2. VALUE READ, WRITE, AND DELETE
  - module: ntdll.dll
    function_name: NtQueryValueKey
    address_resolution:
      strategy: export
    behaviors:
      log_rules:
        - name: "query_val"
          format: "EVENT|NtQueryValueKey|tid={__hook_tid}|hKey=0x{(uintptr_t)input_KeyHandle:x}|valName={input_ValueName}|class={(int)input_KeyValueInformationClass}|len={input_Length}|resultLen={output_ResultLength}|status=0x{(ULONG)__hook_result:x}"

  - module: ntdll.dll
    function_name: NtSetValueKey
    address_resolution:
      strategy: export
    behaviors:
      log_rules:
        - name: "set_val"
          format: "EVENT|NtSetValueKey|tid={__hook_tid}|hKey=0x{(uintptr_t)input_KeyHandle:x}|valName={input_ValueName}|type={input_Type}|cbData={input_DataSize}|status=0x{(ULONG)__hook_result:x}"

  - module: ntdll.dll
    function_name: NtDeleteValueKey
    address_resolution:
      strategy: export
    behaviors:
      log_rules:
        - name: "del_val"
          format: "EVENT|NtDeleteValueKey|tid={__hook_tid}|hKey=0x{(uintptr_t)input_KeyHandle:x}|valName={input_ValueName}|status=0x{(ULONG)__hook_result:x}"

  # 3. KEY DELETION
  - module: ntdll.dll
    function_name: NtDeleteKey
    address_resolution:
      strategy: export
    behaviors:
      log_rules:
        - name: "del_key"
          format: "EVENT|NtDeleteKey|tid={__hook_tid}|hKey=0x{(uintptr_t)input_KeyHandle:x}|status=0x{(ULONG)__hook_result:x}"

  # 4. METADATA & ENUMERATION
  - module: ntdll.dll
    function_name: NtQueryKey
    address_resolution:
      strategy: export
    behaviors:
      log_rules:
        - name: "query_key"
          format: "EVENT|NtQueryKey|tid={__hook_tid}|hKey=0x{(uintptr_t)input_KeyHandle:x}|class={(int)input_KeyInformationClass}|len={input_Length}|resultLen={output_ResultLength}|status=0x{(ULONG)__hook_result:x}"

  - module: ntdll.dll
    function_name: NtEnumerateKey
    address_resolution:
      strategy: export
    behaviors:
      log_rules:
        - name: "enum_key"
          format: "EVENT|NtEnumerateKey|tid={__hook_tid}|hKey=0x{(uintptr_t)input_KeyHandle:x}|index={input_Index}|class={(int)input_KeyInformationClass}|status=0x{(ULONG)__hook_result:x}"

  - module: ntdll.dll
    function_name: NtEnumerateValueKey
    address_resolution:
      strategy: export
    behaviors:
      log_rules:
        - name: "enum_val"
          format: "EVENT|NtEnumerateValueKey|tid={__hook_tid}|hKey=0x{(uintptr_t)input_KeyHandle:x}|index={input_Index}|class={(int)input_KeyValueInformationClass}|status=0x{(ULONG)__hook_result:x}"

  - module: ntdll.dll
    function_name: NtSetInformationKey
    address_resolution:
      strategy: export
    behaviors:
      log_rules:
        - name: "set_info"
          format: "EVENT|NtSetInformationKey|tid={__hook_tid}|hKey=0x{(uintptr_t)input_KeyHandle:x}|class={(int)input_KeySetInformationClass}|len={input_KeySetInformationLength}|status=0x{(ULONG)__hook_result:x}"

  # 5. KEY CLOSE (NtClose filtered to tracked only key handles) 
  - module: ntdll.dll
    function_name: NtClose
    address_resolution:
      strategy: export
    behaviors:
      log_rules:
        - name: "close"
          condition: "IsClosingKeyHandle()"
          format: "EVENT|NtClose|tid={__hook_tid}|hKey=0x{(uintptr_t)input_Handle:x}|status=0x{(ULONG)__hook_result:x}"
      security_policy:
        pre_hook: UntrackClosingKey

  # 6. KEY SECURITY QUERY (NtQuerySecurityObject filtered to tracked key handles)
  - module: ntdll.dll
    function_name: NtQuerySecurityObject
    address_resolution:
      strategy: export
    behaviors:
      log_rules:
        - name: "query_security"
          condition: "IsQueryingKeySecurity()"
          format: "EVENT|NtQuerySecurityObject|tid={__hook_tid}|hKey=0x{(uintptr_t)input_Handle:x}|info=0x{input_SecurityInformation:x}|len={input_Length}|needed={output_LengthNeeded}|status=0x{(ULONG)__hook_result:x}"
      security_policy:
        pre_hook: CheckSecurityQueryHandle
